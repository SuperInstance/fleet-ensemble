[package]
name = "fleet-ensemble"
version = "0.1.0"
edition = "2024"
description = "Agentic ensemble music system — director + instrument agents with JEPA perception and feel-space broadcasting"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
midly = "0.5"
ndarray = "0.16"
axum = "0.8"
dashmap = "6"

[dev-dependencies]
approx = "0.5"
