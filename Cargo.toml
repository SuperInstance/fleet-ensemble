[package]
name = "fleet-ensemble"
version = "0.1.0"
edition = "2024"
description = "Agentic ensemble music system — director + instrument agents with JEPA perception and feel-space broadcasting"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
midly = "0.5"
ndarray = "0.16"
axum = "0.8"
dashmap = "6"
futures = "0.3"

# Real-time MIDI I/O (optional). When enabled, provides live MIDI input/output
# via the `midir` crate. Without this feature, only SMF file parsing (midly)
# and the MidiStream abstraction are available.
midir = { version = "0.5", optional = true }
thiserror = "2"

[dev-dependencies]
approx = "0.5"

[features]
# Enable real-time MIDI input/output via midir (for live hardware MIDI devices)
realtime-midi = ["dep:midir"]
